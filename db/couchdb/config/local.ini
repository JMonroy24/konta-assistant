; Copiar a /opt/couchdb/etc/local.d/ (o montar en docker-compose). SIN credenciales aqui:
; el admin se inyecta con COUCHDB_USER / COUCHDB_PASSWORD desde .env (fuera del repo).
[chttpd]
require_valid_user = true
max_http_request_size = 4294967296

[chttpd_auth]
timeout = 3600

[couchdb]
single_node = true

[cors]
; Solo necesario si la version web de Flutter habla directo con CouchDB.
; En la propuesta del PDF, web/movil usan la API Rust, asi que puede dejarse apagado.
credentials = true
origins = http://localhost:8080
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE

[replicator]
max_jobs = 500
interval = 60000
